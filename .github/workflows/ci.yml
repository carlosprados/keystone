name: ci

# main is the only long-lived branch. Work happens on short-lived keystone/*
# branches that reach main by pull request and are deleted on merge, so the two
# triggers below cover everything: the PR gate, and the merge that lands it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: OpenAPI document is in sync with the code
        # The spec is generated from the agent's route table. If a route or a
        # response type changed without regenerating it, the published API
        # reference would describe something the binary no longer does.
        run: go run ./cmd/openapi-gen -check -o site/content/reference/api/openapi.yaml
      - name: CLI reference is in sync with the code
        # The page is generated from the agent's flag set and keystonectl's
        # command tree. A new command or flag that never reached the docs would
        # otherwise be invisible to anyone reading the site.
        run: go run ./cmd/cli-gen -check -dir site/content/reference
