name: docs

# Builds the documentation site in site/ and publishes it to GitHub Pages.
#
# This workflow only runs Hugo. Content checks — layout, broken links, diagram
# legibility — are local tools, run with `task docs:check` and
# `task docs:check:diagrams` before pushing. Relearn renders mermaid in the
# browser, so nothing here needs one.
#
# Deploys from main only: the site documents features as released, and publishing
# from develop would describe flags that a downloaded binary does not have yet.
#
# Triggers, and why:
#   - push to main      every merge, so the published docs never lag the branch
#                       they describe. The build is ~40s, which is cheaper than
#                       maintaining a path filter that silently skips a needed
#                       rebuild (a change to a Go response type regenerates the
#                       OpenAPI document, which lives under site/).
#   - pull request      builds without deploying, so a broken site is caught
#                       before it is merged.
#   - manual dispatch   publish out of band.
#
# There is deliberately NO tag trigger, and the version in the footer is committed
# in site/hugo.toml rather than derived from git. Both follow from one finding,
# established while cutting v0.3.0 and worth not rediscovering:
#
#   Pages keys a deployment by pages_build_version, and actions/deploy-pages sends
#   GITHUB_SHA for it (src/internal/context.js). A release tag points at a commit
#   main has already published, so a tag build deploys a version Pages already has
#   and the deployment is discarded: four of them reported success and none was
#   ever served. Overriding GITHUB_SHA does not help — the runner applies the
#   default GITHUB_* variables after workflow-declared env, so the value is listed
#   in the step's env block and ignored, and the action reads no other source.
#
# So the release ritual carries the version instead: the release PR bumps
# params.version in site/hugo.toml and the merge that lands it is a new commit,
# which Pages does serve. release.yml then refuses to build a tag whose name
# disagrees with that value, so forgetting the bump fails the release rather than
# silently publishing a stale footer.
#
# One consequence to know: after a tag is cut nothing republishes, which is fine
# because the bump was already published by the merge just before it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'internal/adapter/http/routes.go'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a running one, so a queued push waits
# rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.164.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # enableGitInfo needs history for last-modified dates

      # The Relearn theme is a Hugo module, so the build needs Go to resolve it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: site/go.sum

      - name: Install Hugo (extended)
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          # On a PR there is no Pages base URL; the relative one is enough to
          # prove the site builds.
          hugo --gc --minify \
            ${{ steps.pages.outputs.base_url && format('--baseURL {0}', steps.pages.outputs.base_url) || '' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
