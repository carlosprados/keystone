name: docs

# Builds the documentation site in site/ and publishes it to GitHub Pages.
#
# This workflow only runs Hugo. Content checks — layout, broken links, diagram
# legibility — are local tools, run with `task docs:check` and
# `task docs:check:diagrams` before pushing. Relearn renders mermaid in the
# browser, so nothing here needs one.
#
# Deploys from main only: the site documents features as released, and publishing
# from develop would describe flags that a downloaded binary does not have yet.
#
# Triggers, and why:
#   - push to main      every merge, so the published docs never lag the branch
#                       they describe. The build is ~40s and deploying an
#                       unchanged site is a no-op, which is cheaper than
#                       maintaining a path filter that silently skips a needed
#                       rebuild (a change to a Go response type regenerates the
#                       OpenAPI document, which lives under site/).
#   - tag v*            cutting a release republishes the docs for that release,
#                       so the footer states the version being documented.
#                       NOTE: this needs a deployment policy on the github-pages
#                       environment allowing the tag pattern. The environment
#                       defaults to the default branch only, and a tag ref is not
#                       a branch — the deploy job is then rejected in about a
#                       second with no steps run, which reads like an outage
#                       rather than a permissions problem. Policies live in
#                       Settings → Environments → github-pages, or:
#                         gh api -X POST repos/OWNER/REPO/environments/\
#                           github-pages/deployment-branch-policies \
#                           -f name='v*' -f type=tag
#   - pull request      builds without deploying, so a broken site is caught
#                       before it is merged.
#   - manual dispatch   publish out of band.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'internal/adapter/http/routes.go'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a running one, so a queued push waits
# rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.164.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # enableGitInfo needs history for last-modified dates

      # The Relearn theme is a Hugo module, so the build needs Go to resolve it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: site/go.sum

      - name: Install Hugo (extended)
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Work out the version being documented
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # On a PR there is no Pages base URL; the relative one is enough to
          # prove the site builds.
          hugo --gc --minify \
            ${{ steps.pages.outputs.base_url && format('--baseURL {0}', steps.pages.outputs.base_url) || '' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
